experience:
  - role: Postdoctoral Researcher
    org: LabTAU, INSERM (France)
    start: 2024-02-01
    summary: |
      Since February 2024. Enhancing numerical tools for HIFU therapy of prostate cancer:
      coupled thermoacoustic simulation, retrosimulation of delivered treatments against
      post-treatment MRI, and development of **SimTAU**, a GPU-accelerated platform for
      HIFU treatment planning and analysis.
  - role: Contract Researcher
    org: University of Granada (Spain)
    start: 2023-09-01
    end: 2023-12-31
    summary: |
      September–December 2023. Project drafting and data analysis.
  - role: Visiting Researcher
    org: LabTAU, INSERM (France)
    start: 2022-03-01
    end: 2023-04-30
    summary: |
      Two research stays (March–June 2022 and January–April 2023). Experiments with
      ultrafast ultrasound imaging and analysis of wave propagation in complex media,
      namely viscoelastic liquids.
  - role: PhD Candidate
    org: University of Granada (Spain)
    start: 2019-01-01
    end: 2023-12-31
    summary: |
      Dynamic elastography of viscoelastic soft media (torsional, longitudinal and shear
      waves). Adjunct teaching assistant in *Strength of Materials* and *Mechanics and
      Mechanisms* (fall 2019, 2020, 2021); co-author of a Strength of Materials academic
      book (2020).
  - role: Laboratory Research Staff
    org: University of Granada (Spain)
    start: 2018-01-01
    end: 2019-12-31
    summary: |
      Full-time technician: patent writing, prototype design, technical documentation for
      companies, pilot study measurements and student training.
  - role: Co-founder
    org: Innitius (Spain)
    start: 2018-01-01
    end: 2018-12-31
    summary: |
      Spin-off company providing diagnostics for women's health through non-invasive,
      acoustics-based technologies. [More about Innitius](https://www.innitius.com/).

