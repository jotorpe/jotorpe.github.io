bio: |
  Postdoctoral researcher at LabTAU (INSERM, France), developing numerical
  tools for high-intensity focused ultrasound (HIFU) therapy of prostate cancer.
  Civil engineer turned ultrasound physicist, with a PhD in elastography and
  experience as co-founder of a med-tech spin-off.

